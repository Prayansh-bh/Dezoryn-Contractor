services:
  - type: web
    name: dezoryn-backend
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.prisma && npx prisma db push --schema=prisma/schema.prisma && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        value: havenblue83@gmail.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
